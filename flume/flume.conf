# Flume agent "agent": TAILDIR source -> memory channel -> HBase sink
#
#   /data/logs/access.log --> [logsrc] --> (mem) --> [hbasesink] --> HBase upgrad

agent.sources  = logsrc
agent.channels = mem
agent.sinks    = hbasesink

# ---- Source: follow the log file the generator writes ----------------------
agent.sources.logsrc.type         = TAILDIR
agent.sources.logsrc.channels     = mem
agent.sources.logsrc.filegroups   = access
agent.sources.logsrc.filegroups.access = /data/logs/access.log
# Remembers how far each file has been read, so a restart does not re-send.
agent.sources.logsrc.positionFile = /var/flume/taildir_position.json

# ---- Channel: in-memory buffer between source and sink ---------------------
agent.channels.mem.type                = memory
agent.channels.mem.capacity            = 10000
agent.channels.mem.transactionCapacity = 1000

# Durable alternative (README Lab 6): replace the three lines above with these.
# Events are written to disk and survive an agent restart.
#agent.channels.mem.type          = file
#agent.channels.mem.checkpointDir = /var/flume/checkpoint
#agent.channels.mem.dataDirs      = /var/flume/data

# ---- Sink: write each event as one HBase row -------------------------------
agent.sinks.hbasesink.type          = hbase2
agent.sinks.hbasesink.channel       = mem
agent.sinks.hbasesink.table         = upgrad
agent.sinks.hbasesink.columnFamily  = cf
agent.sinks.hbasesink.batchSize     = 100
agent.sinks.hbasesink.zookeeperQuorum = hbase:2181

# Split the line into columns. Each (...) group maps to one name in colNames.
# The group at rowKeyIndex (0-based) becomes the row key instead of a column,
# and its entry in colNames must be spelled exactly ROW_KEY.
agent.sinks.hbasesink.serializer = org.apache.flume.sink.hbase2.RegexHBase2EventSerializer
agent.sinks.hbasesink.serializer.regex = ^([^|]*)[|]([^|]*)[|]([^|]*)[|]([^|]*)[|]([^|]*)[|]([^|]*)[|]([^|]*)[|]([^|]*)[|]([^|]*)$
agent.sinks.hbasesink.serializer.colNames = ROW_KEY,ts,ip,user,method,path,status,bytes,latency_ms
agent.sinks.hbasesink.serializer.rowKeyIndex = 0
